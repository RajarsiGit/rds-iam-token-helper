# Tests the extension and packages it as a Chrome Web Store zip and a signed .crx.
# Every push uploads both as a workflow artifact. A push to main also publishes a
# GitHub release: v<version> the first time a manifest version is built, then
# pre-releases v<version>-build.<run>.<attempt> until the version is bumped.
#
# The .crx is signed with the CRX_PRIVATE_KEY repository secret (PEM). The key
# fixes the extension ID, so keep using the same one. Without it, only the zip is built.

name: Package extension

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes to main must not both claim the same v<version> tag.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # jsdom and crx3 need Node 22+
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check manifest.json is up to date
        run: |
          node scripts/gen-manifest.mjs
          git diff --exit-code manifest.json

      - name: Build zip
        id: zip
        run: |
          version=$(node -p "require('./manifest.json').version")
          name="rds-iam-token-helper-${version}"
          mkdir -p dist/stage
          # Only what the extension loads at runtime.
          cp -r manifest.json background.js styles.css lib popup icons dist/stage/
          (cd dist/stage && zip -r -X -9 "../${name}.zip" .)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build signed crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::warning::CRX_PRIVATE_KEY secret is not set; skipping the .crx build."
            exit 0
          fi
          key="$RUNNER_TEMP/key.pem"
          printf '%s\n' "$CRX_PRIVATE_KEY" > "$key"
          name="${{ steps.zip.outputs.name }}"
          npx --yes crx3@2.0.0 -p "$key" -o "dist/${name}.crx" < "dist/${name}.zip"
          rm -f "$key"
          test "$(head -c 4 "dist/${name}.crx")" = "Cr24"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            dist/*.zip
            dist/*.crx
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          version=$(node -p "require('./manifest.json').version")
          tag="v${version}"
          flags=()
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            tag="v${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            flags=(--prerelease)
          fi
          gh release create "$tag" dist/*.zip dist/*.crx \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes "${flags[@]}"
          echo "Published release ${tag}" >> "$GITHUB_STEP_SUMMARY"
